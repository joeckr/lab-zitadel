{{- if and .Values.zitadel.secretCreate (not .Values.zitadel.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lab-zitadel.secretName" . }}
  labels:
    {{- include "lab-zitadel.labels" . | nindent 4 }}
type: Opaque
stringData:
  ZITADEL_MASTERKEY: {{ .Values.zitadel.masterkey | quote }}
  ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: {{ include "lab-zitadel.postgresPassword" . | quote }}
  ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: {{ include "lab-zitadel.postgresAdminPassword" . | quote }}
  {{- if .Values.zitadel.firstInstance.adminPassword }}
  ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: {{ .Values.zitadel.firstInstance.adminPassword | quote }}
  {{- end }}
  {{- if .Values.login.enabled }}
  ZITADEL_SESSION_COOKIE_SECRET: {{ .Values.login.sessionCookieSecret | quote }}
  {{- end }}
{{- end }}
