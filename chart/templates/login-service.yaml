{{- if .Values.login.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lab-zitadel.fullname" . }}-login
  labels:
    {{- include "lab-zitadel.labels" . | nindent 4 }}
    app.kubernetes.io/component: login
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "lab-zitadel.loginSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.loginPort }}
      targetPort: http
      protocol: TCP
{{- end }}
