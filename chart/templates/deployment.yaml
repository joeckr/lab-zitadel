apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lab-zitadel.fullname" . }}
  labels:
    {{- include "lab-zitadel.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.zitadel.replicaCount }}
  selector:
    matchLabels:
      {{- include "lab-zitadel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lab-zitadel.labels" . | nindent 8 }}
        {{- include "lab-zitadel.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.zitadel.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.login.enabled }}
        checksum/login-config: {{ include (print $.Template.BasePath "/login-configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.zitadel.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.zitadel.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.zitadel.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.zitadel.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.login.enabled }}
        - name: login-config
          configMap:
            name: {{ include "lab-zitadel.fullname" . }}-login-config
        - name: login-service-key
          secret:
            secretName: {{ include "lab-zitadel.loginKeySecretName" . }}
            items:
              - key: tls.crt
                path: tls.crt
        {{- end }}
      containers:
        - name: zitadel
          image: "{{ .Values.zitadel.image.repository }}:{{ .Values.zitadel.image.tag }}"
          imagePullPolicy: {{ .Values.zitadel.image.pullPolicy }}
          args:
            - start-from-init
            - --masterkeyFromEnv
            - --tlsMode
            - {{ .Values.zitadel.tlsMode | quote }}
            {{- if .Values.login.enabled }}
            - --config
            - /etc/zitadel/config/system-api-users.yaml
            {{- end }}
          {{- with .Values.zitadel.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.zitadel.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "lab-zitadel.fullname" . }}-config
            - secretRef:
                name: {{ include "lab-zitadel.secretName" . }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.login.enabled }}
            - name: login-config
              mountPath: /etc/zitadel/config
              readOnly: true
            - name: login-service-key
              mountPath: /etc/zitadel/login-service-key
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /debug/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /debug/healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /debug/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.zitadel.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
