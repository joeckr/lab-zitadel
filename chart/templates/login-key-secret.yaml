{{- if and .Values.login.enabled (not .Values.login.existingKeySecret) }}
{{- $secretName := include "lab-zitadel.loginKeySecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $crt := "" -}}
{{- $key := "" -}}
{{- if and $existing $existing.data (index $existing.data "tls.crt") (index $existing.data "tls.key") -}}
  {{- $crt = index $existing.data "tls.crt" -}}
  {{- $key = index $existing.data "tls.key" -}}
{{- else -}}
  {{- $cert := genSelfSignedCert .Values.zitadel.externalDomain nil (list .Values.zitadel.externalDomain) 3650 -}}
  {{- $crt = $cert.Cert | b64enc -}}
  {{- $key = $cert.Key | b64enc -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "lab-zitadel.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
{{- end }}
